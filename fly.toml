# fly.toml — NOIR & GOLD (Next.js frontend, Prisma, SQLite on a persistent volume)
# NOTE: "app" must be globally unique on Fly. If taken, run `fly launch --no-deploy`
# and accept the suggested name (it will update this file), or edit it here.
app = "noir-and-gold"
primary_region = "sin" # Singapore; use "bom" (Mumbai) for lower latency to Pakistan

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DB_PATH = "/data/noir.db"

# Persistent volume for the SQLite database. Create it once with:
#   fly volumes create noir_data --region sin --size 1
[[mounts]]
  source = "noir_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # Surface a failing instance quickly without restart loops.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"

[[vm]]
  # Bump memory if the runtime OOMs (SQLite + Next SSR).
  size = "shared-cpu-1x"
  memory = "512mb"
