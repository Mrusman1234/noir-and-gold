<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="craftBg" cx="40%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#262134"/>
      <stop offset="50%" stop-color="#14111B"/>
      <stop offset="100%" stop-color="#0B0A0F"/>
    </radialGradient>
    <linearGradient id="threadGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6CA65"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8B2F"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#craftBg)"/>
  
  <!-- Architectural Borders -->
  <rect x="20" y="20" width="760" height="560" fill="none" stroke="#362F4A" stroke-width="1"/>
  <rect x="32" y="32" width="736" height="536" fill="none" stroke="#D4AF37" stroke-width="0.7" opacity="0.3"/>

  <!-- Macro Velvet Weave Geometry -->
  <g opacity="0.12" stroke="#AA8B2F" stroke-width="0.8">
    <pattern id="weavePattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M0,10 L20,10 M10,0 L10,20"/>
    </pattern>
    <rect x="32" y="32" width="736" height="536" fill="url(#weavePattern)"/>
  </g>

  <!-- Central Intricate Zari / Dabka Medallion Motif -->
  <g transform="translate(400, 300)">
    <!-- Ambient Gold Glow -->
    <circle cx="0" cy="0" r="160" fill="#D4AF37" opacity="0.15"/>
    
    <!-- Outer Filigree Ring -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="url(#threadGold)" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#threadGold)" stroke-width="2"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="url(#threadGold)" stroke-width="1"/>

    <!-- Concentric 8-Point Star Mandala (Mughal Heritage Geometry) -->
    <g stroke="url(#threadGold)" stroke-width="1.5" fill="none" opacity="0.85">
      <polygon points="0,-120 85,-85 120,0 85,85 0,120 -85,85 -120,0 -85,-85"/>
      <polygon points="0,-85 60,-60 85,0 60,60 0,85 -60,60 -85,0 -60,-60"/>
      <circle cx="0" cy="0" r="50"/>
      <circle cx="0" cy="0" r="25" fill="#1C1826" stroke-width="2"/>
      <circle cx="0" cy="0" r="8" fill="#E6CA65"/>
    </g>

    <!-- Radiating Zari Floral Petals -->
    <g stroke="url(#threadGold)" stroke-width="1.2" fill="none" opacity="0.75">
      <path d="M0,-50 Q25,-90 0,-130 Q-25,-90 0,-50"/>
      <path d="M0,50 Q25,90 0,130 Q-25,90 0,50"/>
      <path d="M-50,0 Q-90,25 -130,0 Q-90,-25 -50,0"/>
      <path d="M50,0 Q90,25 130,0 Q90,-25 50,0"/>
      
      <!-- Diagonals -->
      <path d="M-35,-35 Q-70,-80 -95,-95 Q-80,-70 -35,-35"/>
      <path d="M35,35 Q70,80 95,95 Q80,70 35,35"/>
      <path d="M35,-35 Q80,-70 95,-95 Q70,-80 35,-35"/>
      <path d="M-35,35 Q-80,70 -95,95 Q-70,80 -35,35"/>
    </g>

    <!-- Seed Pearl / Bead Accents -->
    <g fill="#F9F9FA" opacity="0.85">
      <circle cx="0" cy="-140" r="2.5"/>
      <circle cx="0" cy="140" r="2.5"/>
      <circle cx="-140" cy="0" r="2.5"/>
      <circle cx="140" cy="0" r="2.5"/>
      <circle cx="-100" cy="-100" r="2.5"/>
      <circle cx="100" cy="100" r="2.5"/>
      <circle cx="100" cy="-100" r="2.5"/>
      <circle cx="-100" cy="100" r="2.5"/>
    </g>
  </g>

  <!-- Atelier Caption -->
  <text x="400" y="540" font-family="'Times New Roman', serif" font-size="12" letter-spacing="4" fill="#D4AF37" text-anchor="middle" opacity="0.85">PURE SILK &amp; HAND-LOOM ZARI TEXTURE</text>
</svg>
