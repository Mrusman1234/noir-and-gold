<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <radialGradient id="womenBg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#262134"/>
      <stop offset="40%" stop-color="#14111B"/>
      <stop offset="100%" stop-color="#0B0A0F"/>
    </radialGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6CA65"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8B2F"/>
    </linearGradient>
    <linearGradient id="anarkaliBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262134"/>
      <stop offset="45%" stop-color="#1C1826"/>
      <stop offset="100%" stop-color="#0B0A0F"/>
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#womenBg)"/>

  <!-- Golden Ambient Glow -->
  <circle cx="300" cy="380" r="240" fill="#D4AF37" opacity="0.12"/>

  <!-- Thin Luxury Framing Line -->
  <rect x="24" y="24" width="552" height="752" fill="none" stroke="#362F4A" stroke-width="1"/>
  <rect x="36" y="36" width="528" height="728" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.35"/>

  <!-- Anarkali Silhouette & Silk Drape -->
  <g transform="translate(300, 140)">
    <!-- Bodice -->
    <path d="M-60,0 L60,0 L50,140 L-50,140 Z" fill="url(#anarkaliBody)" stroke="#362F4A" stroke-width="1"/>
    <!-- Deep Neckline with Gold Zari Embellishment -->
    <path d="M-35,0 Q0,75 35,0" fill="none" stroke="url(#goldShine)" stroke-width="3"/>
    <path d="M-45,0 Q0,95 45,0" fill="none" stroke="url(#goldShine)" stroke-width="1" stroke-dasharray="2 3"/>

    <!-- Flaired Velvet Skirt (Ghera) -->
    <path d="M-50,140 Q-160,320 -200,560 L200,560 Q160,320 50,140 Z" fill="url(#anarkaliBody)"/>
    
    <!-- Flowing Dupatta Drape over Shoulder -->
    <path d="M-60,10 Q-140,80 -170,300 Q-200,480 -180,560 L-140,560 Q-160,420 -130,280 Q-100,100 -50,30 Z" fill="#1C1826" opacity="0.85" stroke="url(#goldShine)" stroke-width="1"/>

    <!-- Intricate Floral & Paisley Embroidery Panels -->
    <g stroke="url(#goldShine)" stroke-width="1.2" fill="none" opacity="0.75">
      <!-- Center Kalis -->
      <line x1="0" y1="140" x2="0" y2="560"/>
      <line x1="-30" y1="140" x2="-80" y2="560"/>
      <line x1="30" y1="140" x2="80" y2="560"/>
      <line x1="-50" y1="140" x2="-150" y2="560"/>
      <line x1="50" y1="140" x2="150" y2="560"/>
      
      <!-- Bottom Ghera Heavy Gold Border (Daaman) -->
      <path d="M-200,540 L200,540" stroke="url(#goldShine)" stroke-width="2.5"/>
      <path d="M-200,550 L200,550" stroke="url(#goldShine)" stroke-width="4"/>
      <path d="M-200,558 L200,558" stroke="url(#goldShine)" stroke-width="1.5"/>

      <!-- Traditional Mughal Booti Motifs -->
      <circle cx="0" cy="240" r="5"/>
      <circle cx="-40" cy="290" r="5"/>
      <circle cx="40" cy="290" r="5"/>
      <circle cx="0" cy="360" r="7"/>
      <circle cx="-70" cy="400" r="6"/>
      <circle cx="70" cy="400" r="6"/>
      <circle cx="0" cy="470" r="8"/>
      <circle cx="-110" cy="500" r="7"/>
      <circle cx="110" cy="500" r="7"/>
    </g>
  </g>

  <!-- Editorial Text Label Stamp -->
  <text x="300" y="735" font-family="'Times New Roman', serif" font-size="14" letter-spacing="4" fill="#D4AF37" text-anchor="middle" opacity="0.9">HAUTE PRÊT &amp; COUTURE</text>
</svg>
