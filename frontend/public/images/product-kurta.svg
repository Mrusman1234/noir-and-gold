    <!-- Fine Thread Placket -->
    <line x1="0" y1="-10" x2="0" y2="280" stroke="url(#pGold3)" stroke-width="1.5"/>
    <g fill="#E6CA65">
      <circle cx="0" cy="40" r="2.5"/>
      <circle cx="0" cy="85" r="2.5"/>
      <circle cx="0" cy="130" r="2.5"/>
      <circle cx="0" cy="175" r="2.5"/>
    </g>
    <!-- Side Slits (Chak) -->
    <line x1="-75" y1="280" x2="-80" y2="520" stroke="url(#pGold3)" stroke-width="1" opacity="0.6"/>
    <line x1="75" y1="280" x2="80" y2="520" stroke="url(#pGold3)" stroke-width="1" opacity="0.6"/>
  </g>

  <text x="300" y="730" font-family="'Times New Roman', serif" font-size="12" letter-spacing="3" fill="#E6CA65" text-anchor="middle" opacity="0.8">PURE RAW SILK KURTA SET</text>
