  </defs>

  <rect width="600" height="800" fill="url(#pKurtaBg)"/>
  <rect x="16" y="16" width="568" height="768" fill="none" stroke="#362F4A" stroke-width="1"/>

  <!-- Kurta Silhouette -->
  <g transform="translate(300, 160)">
    <path d="M-80,20 L-35,-10 L35,-10 L80,20 L75,250 L80,520 L-80,520 L-75,250 Z" fill="#14111B" stroke="#262134"/>
    <!-- Band Collar -->
