    <g fill="#E6CA65">
      <circle cx="0" cy="30" r="3"/>
      <circle cx="0" cy="70" r="3"/>
      <circle cx="0" cy="110" r="3"/>
      <circle cx="0" cy="150" r="3"/>
      <circle cx="0" cy="190" r="3"/>
      <circle cx="0" cy="230" r="3"/>
      <circle cx="0" cy="270" r="3"/>
      <circle cx="0" cy="310" r="3"/>
    </g>
